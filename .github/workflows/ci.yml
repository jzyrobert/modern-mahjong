name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenSSL legacy provider keeps Node 20 + older crypto-using build
  # tools (lhci, certain expo plugins) happy.
  NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test (packages)
        run: pnpm -r --filter './packages/*' test

      - name: Test (client unit)
        run: pnpm --filter @mahjong/client test

      - name: Lint
        run: pnpm lint

  build-server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Dry-run server bundle
        run: pnpm --filter @mahjong/server build

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-web-bundle
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    # Web Playwright spec, run against the Expo Web export. The
    # multi-player spec exercises the server's room/coordination
    # contract; kept on web because Detox doesn't do multi-instance
    # well. Single-instance native e2e (Detox / Maestro) is a
    # separate follow-up — see TODO.md.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mahjong/client e2e:install

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mahjong/client exec playwright install-deps chromium

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      - name: Run e2e
        run: pnpm --filter @mahjong/client e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      # ubuntu-latest ships google-chrome-stable preinstalled at
      # /usr/bin/google-chrome, which lhci's Chrome-launcher auto-detects.
      - name: Run Lighthouse CI
        run: pnpm --filter @mahjong/client lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/client/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
