name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test (packages)
        run: pnpm test

      - name: Lint
        run: pnpm lint

  build-client:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build client
        run: pnpm --filter @mahjong/client build

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-bundle
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  build-server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Dry-run server bundle
        run: pnpm --filter @mahjong/server build

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build web bundle
        run: pnpm --filter @mahjong/client build

      - name: Add Android platform
        working-directory: apps/client
        run: npx cap add android

      - name: Sync web bundle into Android shell
        working-directory: apps/client
        run: npx cap sync android

      # Cache the Gradle download + build cache. The android/ directory itself
      # is regenerated each run, so we key off stable inputs (capacitor + plugin
      # versions in package.json) rather than the generated gradle files.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'apps/client/capacitor.config.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: client-apk-debug
          path: apps/client/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
