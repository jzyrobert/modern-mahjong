name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenSSL legacy provider keeps Node 20 + older crypto-using build
  # tools (lhci, certain expo plugins) happy.
  NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

jobs:
  # Path-filter gate: emits flags for what changed so downstream jobs
  # can `if:`-skip when their inputs didn't move. A skipped required
  # status check still counts as success for branch protection, so
  # docs-only PRs (CLAUDE.md, TODO.md, README, *.md, docs/**, .github
  # screenshots, etc.) finish CI in ~10s with every heavyweight job
  # marked "skipped".
  #
  # `code` — anything that should re-run typecheck / lint / unit tests.
  # `client` — narrower subset that should additionally re-run the
  #            Playwright suite and Lighthouse. Server-only changes
  #            (apps/server/**) trip `code` but not `client`.
  #
  # Always-include paths in both filters: `ci.yml` itself, the shared
  # `setup` composite action, and `pnpm-lock.yaml` — any of those moving
  # means the CI environment / dep graph changed and the full pipeline
  # has to run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'biome.json'
            client:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - 'apps/client/**'
              - 'packages/game-logic/**'
              - 'packages/protocol/**'
              - 'packages/bots/**'
              - 'packages/match-session/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'biome.json'

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test (packages)
        run: pnpm -r --filter './packages/*' test

      - name: Test (client unit)
        run: pnpm --filter @mahjong/client test

      - name: Lint
        run: pnpm lint

  build-server:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Dry-run server bundle
        run: pnpm --filter @mahjong/server build

  # Per-shard runner for the Playwright suite. `e2e` below depends on
  # this matrix and exists purely as a sync point so the "e2e" status
  # check name stays stable for branch protection. The matrix expands
  # to "e2e-shard (1)" / "(2)" / ... etc. and Playwright splits the
  # spec list deterministically via `--shard=N/M`. Each shard runs its
  # own `export-web` so it can start immediately after `test`; a
  # central build-web job would serialise the whole second tier behind
  # a single 60 s artifact upload, which on this matrix is slower
  # than re-exporting in parallel (export is ~30 s).
  e2e-shard:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mahjong/client e2e:install

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mahjong/client exec playwright install-deps chromium

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      - name: Run e2e shard ${{ matrix.shard }}/4
        run: pnpm --filter @mahjong/client e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Aggregator: succeeds iff every shard succeeded. Lets branch
  # protection keep requiring a single check named "e2e" without
  # having to enumerate every matrix leg. Skips along with the matrix
  # when the path-filter says no client paths moved.
  e2e:
    runs-on: ubuntu-latest
    needs: [changes, e2e-shard]
    if: needs.changes.outputs.client == 'true'
    steps:
      - run: 'echo "All e2e shards passed"'

  lighthouse:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      # ubuntu-latest ships google-chrome-stable preinstalled at
      # /usr/bin/google-chrome, which lhci's Chrome-launcher auto-detects.
      - name: Run Lighthouse CI
        run: pnpm --filter @mahjong/client lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/client/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
