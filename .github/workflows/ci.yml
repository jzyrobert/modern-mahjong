name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenSSL legacy provider keeps Node 20 + older crypto-using build
  # tools (lhci, certain expo plugins) happy.
  NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test (packages)
        run: pnpm -r --filter './packages/*' test

      - name: Test (client unit)
        run: pnpm --filter @mahjong/client test

      - name: Lint
        run: pnpm lint

  build-server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Dry-run server bundle
        run: pnpm --filter @mahjong/server build

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-web-bundle
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  # Per-shard runner for the Playwright suite. `e2e` below depends on
  # this matrix and exists purely as a sync point so the "e2e" status
  # check name stays stable for branch protection. The matrix expands
  # to "e2e-shard (1)" / "(2)" / ... etc. and Playwright splits the
  # spec list deterministically via `--shard=N/M`.
  e2e-shard:
    runs-on: ubuntu-latest
    needs: [test, build-web]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mahjong/client e2e:install

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mahjong/client exec playwright install-deps chromium

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: client-web-bundle
          path: apps/client/dist

      - name: Run e2e shard ${{ matrix.shard }}/4
        run: pnpm --filter @mahjong/client e2e --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Aggregator: succeeds iff every shard succeeded. Lets branch
  # protection keep requiring a single check named "e2e" without
  # having to enumerate every matrix leg.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    steps:
      - run: 'echo "All e2e shards passed"'

  lighthouse:
    runs-on: ubuntu-latest
    needs: [test, build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: client-web-bundle
          path: apps/client/dist

      # ubuntu-latest ships google-chrome-stable preinstalled at
      # /usr/bin/google-chrome, which lhci's Chrome-launcher auto-detects.
      - name: Run Lighthouse CI
        run: pnpm --filter @mahjong/client lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/client/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
