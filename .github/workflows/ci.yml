name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      buildMobile:
        description: 'Build the Android APK via EAS local'
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenSSL legacy provider keeps Node 20 + older crypto-using build
  # tools (lhci, certain expo plugins) happy. Memory headroom for
  # `eas build --local` on the Android job.
  NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Test (packages + server)
        run: pnpm -r --filter './packages/*' --filter './apps/server' test

      - name: Lint
        run: pnpm lint

  build-server:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Dry-run server bundle
        run: pnpm --filter @mahjong/server build

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-web-bundle
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  build-mobile-android:
    # Build the Android APK on every push to main, on PRs that touch
    # apps/client, or on manual workflow_dispatch with buildMobile=yes.
    # PRs to other paths skip it to keep CI quick.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.buildMobile == 'yes') ||
      contains(github.event.pull_request.changed_files || '', 'apps/client/')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install EAS CLI
        run: pnpm add -g eas-cli@latest

      - name: Verify EAS CLI
        run: eas --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'apps/client/app.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # `eas build --local` runs the entire Android build on this
      # runner (no EAS cloud minutes consumed). Output is a debug
      # APK we upload as an artifact, mirroring the previous
      # Capacitor `build-android` flow.
      - name: Build development APK
        working-directory: apps/client
        run: |
          eas build --platform android --profile development --local --non-interactive --output=./app-dev.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_ENV: development

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-apk-debug
          path: apps/client/app-dev.apk
          if-no-files-found: error
          retention-days: 14

  e2e:
    # Web Playwright spec, run against the Expo Web export. The
    # multi-player spec exercises the server's room/coordination
    # contract; kept on web because Detox doesn't do multi-instance
    # well. Single-instance native e2e (Detox / Maestro) is a
    # separate follow-up — see TODO.md.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('apps/client/package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @mahjong/client e2e:install

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @mahjong/client exec playwright install-deps chromium

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      - name: Run e2e
        run: pnpm --filter @mahjong/client e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Export Expo Web bundle
        run: pnpm --filter @mahjong/client export-web

      # ubuntu-latest ships google-chrome-stable preinstalled at
      # /usr/bin/google-chrome, which lhci's Chrome-launcher auto-detects.
      - name: Run Lighthouse CI
        run: pnpm --filter @mahjong/client lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/client/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
