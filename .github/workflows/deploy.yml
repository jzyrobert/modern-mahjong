name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't interrupt an in-flight deploy — wait for it to finish before queuing the next.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      # Wrangler bundles the worker entry by walking workspace imports
      # (`@mahjong/game-logic`, `@mahjong/protocol`, `@mahjong/bots`), so
      # the workspace symlinks must exist before `wrangler deploy` runs.
      # Also puts pnpm on PATH for wrangler-action's `packageManager: pnpm`.
      - uses: ./.github/actions/setup

      - name: Deploy Worker (partyserver / Durable Objects)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          packageManager: pnpm
          command: deploy

  deploy-client:
    runs-on: ubuntu-latest
    needs: deploy-server
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Surface the silent-fallback footgun: VITE_SERVER_URL not being set means
      # the production bundle bakes in `http://localhost:8787`, which won't work
      # against the deployed Worker. See docs/DEPLOY.md.
      - name: Verify VITE_SERVER_URL is set
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::error::VITE_SERVER_URL secret is not set. The Pages bundle would point at localhost. See docs/DEPLOY.md → 'First deploy'."
            exit 1
          fi

      - name: Build client
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: pnpm --filter @mahjong/client build

      # Run wrangler from `apps/server` so wrangler-action's pnpm-based
      # auto-install finds the workspace's wrangler binary (it's a devDep
      # of `apps/server`). Without `workingDirectory + packageManager`,
      # wrangler-action runs `pnpm i wrangler` at the root, which is a
      # workspace and rejects ad-hoc `pnpm i <pkg>` from CI.
      #
      # `pages deploy --project-name=...` does NOT auto-create the project,
      # so we attempt creation first; the `|| true` is harmless because:
      #   - if the project already exists, create errors with code 8000005
      #     and we skip past it,
      #   - if the API token / account is wrong, the deploy step right
      #     after will fail with the actual auth error.
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          packageManager: pnpm
          preCommands: pnpm exec wrangler pages project create modern-mahjong --production-branch=main || true
          command: pages deploy ../client/dist --project-name=modern-mahjong --branch=main --commit-dirty=true
