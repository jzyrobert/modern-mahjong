name = "modern-mahjong-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MatchRoom"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "LobbyRegistry"
class_name = "LobbyRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyRegistry"]

# Play statistics (`src/stats.ts`). Schema: `migrations/0001_stats.sql`
# — apply with `wrangler d1 migrations apply modern-mahjong-stats --remote`.
# The dashboard is served (unauthenticated, unlinked) at `/stats`.
[[d1_databases]]
binding = "STATS"
database_name = "modern-mahjong-stats"
database_id = "d6023ad8-3156-4dd5-a881-b5fe78d46277"
migrations_dir = "migrations"
